---
# Tests the role on Rocky Linux 9 and 10 in systemd containers, with firewalld
# from the distribution. The role needs nothing else, so there is no prepare.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  # firewalld needs NET_ADMIN to manage nftables in the container's network
  # namespace. (A privileged el9 container breaks sudo in rootful podman.)
  - name: firewall-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    capabilities:
      - NET_ADMIN
      - NET_RAW
  - name: firewall-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    capabilities:
      - NET_ADMIN
      - NET_RAW
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
